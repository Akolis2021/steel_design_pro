<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CVE 502 – Steel Beam Design (Propped Cantilever)</title>
  <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
  <style>
    /* ── Global ─────────────────────────────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #b8bec8;
      font-family: 'Architects Daughter', cursive;
      padding-bottom: 88px;
    }

    /* ── A4 Page ─────────────────────────────────────────── */
    .page {
      background: #fffef9;
      background-image: repeating-linear-gradient(
        transparent 0px, transparent 23px,
        #dde6ef    23px, #dde6ef    24px
      );
      width: 210mm;
      min-height: 297mm;
      margin: 16px auto;
      box-shadow: 0 4px 24px rgba(0,0,0,.25);
      position: relative;
      overflow: hidden;
      page-break-after: always;
      display: flex;
      flex-direction: column;
    }

    /* red margin strip */
    .page::before {
      content: '';
      position: absolute;
      left: 21mm;
      top: 0; bottom: 0;
      border-left: 2px solid #cc0000;
      pointer-events: none;
      z-index: 1;
    }

    /* ── 3-column table header ──────────────────────────── */
    .tbl-head {
      display: grid;
      grid-template-columns: 21mm 1fr 32mm;
      border: 2px solid #222;
      margin: 5mm 5mm 0;
      font-family: Arial, sans-serif;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .tbl-head div {
      padding: 4px 6px;
      text-align: center;
    }
    .tbl-head div:not(:last-child) {
      border-right: 1.5px solid #222;
    }

    /* ── 3-column calculation body ──────────────────────── */
    .sheet-body {
      display: grid;
      grid-template-columns: 21mm 1fr 32mm;
      border: 2px solid #222;
      border-top: none;
      margin: 0 5mm 4mm;
      flex: 1;
      align-content: start;
    }

    /* Reference cell */
    .rc {
      border-right: 1.5px solid #222;
      border-bottom: 1px solid #dde6ef;
      padding: 1px 4px;
      font-size: 8.5px;
      color: #666;
      line-height: 24px;
      min-height: 24px;
    }

    /* Calculation cell */
    .cc {
      border-right: 1.5px solid #222;
      border-bottom: 1px solid #dde6ef;
      padding: 1px 8px;
      font-size: 13px;
      color: #00008b;
      line-height: 24px;
      min-height: 24px;
    }

    /* Output cell */
    .oc {
      border-bottom: 1px solid #dde6ef;
      padding: 1px 5px;
      font-size: 11.5px;
      color: #00008b;
      line-height: 24px;
      min-height: 24px;
      text-align: right;
    }

    /* Taller rows (for diagrams) */
    .rc.tall, .cc.tall, .oc.tall { min-height: auto; line-height: normal; padding: 6px 8px; }

    /* Page number */
    .pgnum {
      border-top: 1.5px solid #222;
      margin: 0 5mm;
      text-align: center;
      padding: 2px 0;
      font-size: 11px;
      color: #00008b;
    }

    /* Inline result box */
    .rbox {
      display: inline-block;
      border: 1.5px solid #00008b;
      padding: 0 6px;
      margin: 0 2px;
    }

    .ok   { color: #166534; font-weight: bold; }
    .fail { color: #991b1b; font-weight: bold; }
    .uline { text-decoration: underline; font-weight: bold; }

    /* ── Fixed input toolbar ────────────────────────────── */
    #bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #1e293b;
      border-top: 3px solid #3b82f6;
      padding: 7px 14px;
      z-index: 99;
    }
    #bar .grid {
      max-width: 960px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(8,1fr) 78px;
      gap: 8px;
      align-items: end;
    }
    #bar label {
      display: block;
      font-family: Arial, sans-serif;
      font-size: 9px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 2px;
    }
    #bar input, #bar select {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 3px;
      color: #fbbf24;
      font-family: monospace;
      font-size: 13px;
      padding: 3px 5px;
    }
    #bar .hint {
      font-family: Arial, sans-serif;
      font-size: 8px;
      color: #475569;
      margin-top: 1px;
    }
    #prtBtn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 9px 6px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    @media print {
      #bar { display: none !important; }
      body { background: white; padding-bottom: 0; }
      .page { margin: 0; box-shadow: none; width: 100%; page-break-after: always; }
    }
  </style>
</head>
<body>

<div id="out"></div>

<!-- ═══ INPUT TOOLBAR ═══ -->
<div id="bar">
  <div class="grid">
    <div>
      <label>a (m)</label>
      <input id="iL1" type="number" step="0.1" value="8">

    </div>
    <div>
      <label>b₁ (mm)</label>
      <input id="ib1" type="number" step="5" value="100">

    </div>
    <div>
      <button id="prtBtn" onclick="window.print()">⎙ Print<br>PDF</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  BS 5950 UB TABLE  (D,B,t,T,r,d mm | Sx,Zx cm³ | Ix cm⁴ | m kg/m)
// ═══════════════════════════════════════════════════════
const UB = [
  {n:"254×102×22",m:22,D:254.0,B:101.6,t:5.8,T:6.8,r:7.6,d:225.1,Sx:262,Zx:226,Ix:2870},
  {n:"305×102×25",m:25,D:304.8,B:101.9,t:6.1,T:6.8,r:7.6,d:275.9,Sx:338,Zx:307,Ix:4380},
  {n:"305×127×37",m:37,D:304.4,B:123.4,t:7.2,T:10.7,r:8.9,d:264.6,Sx:539,Zx:471,Ix:7160},
  {n:"305×127×48",m:48,D:310.4,B:125.3,t:9.0,T:14.0,r:8.9,d:264.6,Sx:706,Zx:616,Ix:9580},
  {n:"305×165×40",m:40,D:303.8,B:165.1,t:6.1,T:10.2,r:8.9,d:265.7,Sx:624,Zx:560,Ix:8500},
  {n:"305×165×54",m:54,D:310.9,B:166.9,t:7.7,T:13.7,r:8.9,d:265.7,Sx:845,Zx:753,Ix:11700},
  {n:"356×171×45",m:45,D:352.0,B:171.1,t:6.9,T:9.7,r:10.2,d:312.3,Sx:775,Zx:687,Ix:12100},
  {n:"356×171×51",m:51,D:355.6,B:171.5,t:7.3,T:11.5,r:10.2,d:312.3,Sx:895,Zx:796,Ix:14200},
  {n:"356×171×57",m:57,D:358.6,B:172.2,t:8.0,T:13.0,r:10.2,d:312.3,Sx:1010,Zx:896,Ix:16000},
  {n:"356×171×67",m:67,D:364.0,B:173.2,t:9.1,T:15.7,r:10.2,d:312.3,Sx:1210,Zx:1070,Ix:19500},
  {n:"406×178×54",m:54,D:402.6,B:177.6,t:7.6,T:10.9,r:10.2,d:360.5,Sx:1050,Zx:925,Ix:18600},
  {n:"406×178×60",m:60,D:406.4,B:177.8,t:7.8,T:12.8,r:10.2,d:360.5,Sx:1200,Zx:1060,Ix:21500},
  {n:"406×178×67",m:67,D:409.4,B:178.8,t:8.8,T:14.3,r:10.2,d:360.5,Sx:1350,Zx:1190,Ix:24300},
  {n:"406×178×74",m:74,D:412.8,B:179.7,t:9.7,T:16.0,r:10.2,d:360.5,Sx:1500,Zx:1320,Ix:27300},
  {n:"457×152×52",m:52,D:449.8,B:152.4,t:7.6,T:10.9,r:10.2,d:407.0,Sx:1090,Zx:949,Ix:21300},
  {n:"457×152×60",m:60,D:454.7,B:152.9,t:8.0,T:13.3,r:10.2,d:407.0,Sx:1290,Zx:1120,Ix:25500},
  {n:"457×152×67",m:67,D:457.2,B:151.9,t:9.1,T:15.0,r:10.2,d:407.0,Sx:1450,Zx:1250,Ix:28600},
  {n:"457×152×74",m:74,D:461.3,B:152.7,t:9.9,T:17.0,r:10.2,d:407.0,Sx:1630,Zx:1410,Ix:32400},
  {n:"457×152×82",m:82,D:465.1,B:153.5,t:10.7,T:18.9,r:10.2,d:407.0,Sx:1800,Zx:1560,Ix:36200},
  {n:"457×191×67",m:67,D:453.6,B:189.9,t:8.5,T:12.7,r:10.2,d:407.9,Sx:1470,Zx:1300,Ix:29400},
  {n:"457×191×74",m:74,D:457.2,B:190.5,t:9.1,T:14.5,r:10.2,d:407.9,Sx:1660,Zx:1460,Ix:33300},
  {n:"457×191×82",m:82,D:460.2,B:191.3,t:9.9,T:16.0,r:10.2,d:407.9,Sx:1870,Zx:1610,Ix:37100},
  {n:"457×191×89",m:89,D:463.6,B:192.0,t:10.6,T:17.7,r:10.2,d:407.9,Sx:2100,Zx:1770,Ix:41000},
  {n:"457×191×98",m:98,D:467.4,B:192.8,t:11.4,T:19.6,r:10.2,d:407.9,Sx:2340,Zx:1960,Ix:45700},
  {n:"533×210×82",m:82,D:528.3,B:208.7,t:9.6,T:13.2,r:12.7,d:476.5,Sx:2060,Zx:1800,Ix:47500},
  {n:"533×210×92",m:92,D:533.1,B:209.3,t:10.2,T:15.6,r:12.7,d:476.5,Sx:2370,Zx:2080,Ix:55400},
  {n:"533×210×101",m:101,D:536.7,B:210.1,t:10.9,T:17.4,r:12.7,d:476.5,Sx:2620,Zx:2300,Ix:61700},
  {n:"533×210×109",m:109,D:539.5,B:210.8,t:11.6,T:18.8,r:12.7,d:476.5,Sx:2830,Zx:2470,Ix:66700},
  {n:"533×210×122",m:122,D:544.6,B:211.9,t:12.8,T:21.3,r:12.7,d:476.5,Sx:3200,Zx:2790,Ix:76000},
  {n:"610×229×101",m:101,D:602.6,B:227.6,t:10.6,T:14.8,r:12.7,d:547.3,Sx:2870,Zx:2510,Ix:75700},
  {n:"610×229×113",m:113,D:607.3,B:228.2,t:11.2,T:17.3,r:12.7,d:547.3,Sx:3280,Zx:2880,Ix:87500},
  {n:"610×229×125",m:125,D:612.2,B:229.0,t:11.9,T:19.6,r:12.7,d:547.3,Sx:3680,Zx:3220,Ix:98600},
  {n:"610×229×140",m:140,D:617.0,B:230.1,t:13.1,T:22.1,r:12.7,d:547.3,Sx:4140,Zx:3630,Ix:111000},
];

// ── helpers ──────────────────────────────────────────────
const f  = (v, d=2) => (+v).toFixed(d);
const f0 = (v)      => (+v).toFixed(0);
const OK = (p) => p ? '<span class="ok">&#10003; OK</span>' : '<span class="fail">&#10007; FAIL</span>';

function R(ref, calc, out='') {
  return `<div class="rc">${ref}</div><div class="cc">${calc}</div><div class="oc">${out}</div>`;
}

function BLANK() {
  return `<div class="rc"></div><div class="cc"></div><div class="oc"></div>`;
}

function SVGR(ref, svgHTML, out='') {
  return `<div class="rc tall" style="align-self:center;">${ref}</div>
          <div class="cc tall">${svgHTML}</div>
          <div class="oc tall" style="align-self:center;">${out}</div>`;
}

// ═══════════════════════════════════════════════════════
//  MAIN CALCULATION ENGINE
// ═══════════════════════════════════════════════════════
function update() {
  const a    = +document.getElementById('iL1').value  || 8;
  const b    = +document.getElementById('iL2').value  || 6.4;
  const Gk   = +document.getElementById('iGk').value  || 4;
  const Qk   = +document.getElementById('iQk').value  || 7;
  const Q    = +document.getElementById('iQ').value   || 70;
  const py   = +document.getElementById('iPy').value  || 460;
  const b1   = +document.getElementById('ib1').value  || 100;

  const L   = a + b;             // total propped cantilever span A to B
  const wu  = 1.4*Gk + 1.6*Qk;   // factored UDL
  const Wu  = 1.6*Q;             // factored point load
  const tot = wu*L + Wu;         // total factored load

  // ── Area Moment Method (Macaulay's) for Propped Cantilever ──
  // A1x1: Moment of area of Rb triangle diagram about A
  const A1_coeff = Math.pow(L, 3) / 3;
  // A2x2: Moment of area of UDL parabola diagram about A
  const A2X2 = (wu * Math.pow(L, 4)) / 8;
  // A3x3: Moment of area of Pt load triangle diagram about A
  const part1 = 0.5 * a * (Wu * a);
  const part2 = L - (a/3);
  const A3X3 = part1 * part2;
  
  const RB = (A2X2 + A3X3) / A1_coeff;
  const RA = tot - RB;

  // ── Shear forces ──
  const SFA  = RA;
  const SFCb = RA - wu*a;           
  const SFCa = SFCb - Wu;            
  const SFBl = SFCa - wu*b;         

  // ── Bending moments ──
  // Calculated matching the PDF textual steps exactly 
  const MA  = RB*L - wu*Math.pow(L, 2)/2 - Wu*a;  
  const BMC = RB*b - wu*Math.pow(b, 2)/2;
  
  const Mmax = Math.max(Math.abs(MA), Math.abs(BMC));

  // ── Section selection ──
  const Sx_req  = (Mmax*1e6)/(py); // mm3
  const Sx_req_cm3 = Sx_req / 1000;
  
  // Best practice: Find the *lightest* valid section first, resolving PDF selection logic
  const validSecs = UB.filter(s => s.Sx >= Sx_req_cm3);
  validSecs.sort((s1, s2) => s1.m - s2.m); // sort by mass
  let sec = validSecs[0] || UB.at(-1);

  // ── Classification ──
  const eps   = Math.sqrt(275/py);
  const b_T   = (sec.B/2)/sec.T; // correct standard formula for b/T
  const d_t   = sec.d/sec.t;
  const flCls = b_T<=9*eps  ? 'Plastic' : b_T<=10*eps ? 'Compact' : b_T<=15*eps ? 'Semi-compact' : 'Slender';
  const wbCls = d_t<=80*eps  ? 'Plastic' : d_t<=100*eps ? 'Compact' : 'Semi-compact';

  // ── Shear ──
  const Av    = sec.t * sec.D;
  const Pv    = 0.6*py*Av/1e3;
  const Fv    = Math.max(Math.abs(RA), Math.abs(RB));
  const lowSh = Fv <= 0.6*Pv;
  const sh_ok = Fv <= Pv;

  // ── Moment capacity ──
  const Mc_f  = py*sec.Sx*1e3/1e6;
  const Mc_l  = 1.2*py*sec.Zx*1e3/1e6;
  const Mc    = Math.min(Mc_f, Mc_l);

  // ── Moment due to self weight (additive scale) ──
  const Gsw   = sec.m * 9.81/1000;
  // Span moment using exactly 9/128 formula as per PDF handwritten math
  const Msw   = 1.4 * Gsw * L * L * (9 / 128);
  const Mmax2 = Math.abs(MA) + Msw; 
  const mc_ok = Mmax2 <= Mc;

  // ── Deflection (unfactored imposed) ──
  const EI    = 205e3 * sec.Ix * 1e4;          // N·mm²
  const Lmm   = L*1e3, amm=a*1e3, bmm=b*1e3;
  // Matching the PDF's approximation layout for propped limit check
  const dS_udl = Qk*Math.pow(Lmm,4)/(185*EI);
  const dS_pt  = Q*1e3*Math.pow(amm,2)*Math.pow(bmm,2)/(3*EI*Lmm);
  const dC     = dS_udl + dS_pt;
  const dCL    = Lmm/180;
  const dC_ok  = dC <= dCL;

  // ── Web bearing / buckling ──
  const k      = sec.T + sec.r;
  const n      = 2;
  const Pbw    = (b1 + n*k)*sec.t*py/1e3;
  const Pcs    = (b1 * k) * py/1e3; // Resolving the PDF contact stress typo structurally
  const epsS   = Math.sqrt(275/py);
  
  const bot_in = (b1 + n*k) * sec.d;
  const Px     = (25*epsS*sec.t / Math.sqrt(bot_in)) * Pbw;
  
  const br_ok  = RA<=Pbw;
  const bk_ok  = RA<=Px;
  const allOk  = sh_ok&&mc_ok&&dC_ok&&br_ok&&bk_ok;

  // ════════════════════════════════════════════════════════
  //  SVG: STRUCTURAL DIAGRAM (PROPPED CANTILEVER)
  // ════════════════════════════════════════════════════════
  const SW=480, SH=160, beamY=85;
  const Ax=40, Bx=SW-40;
  const Cx = Ax + Math.round((Bx-Ax)*(a/L)); 
  
  let sp='';
  for(let i=0;i<=13;i++){
    const x = Ax + i*(Bx-Ax)/13;
    sp+=`<line x1="${x}" y1="${beamY-30}" x2="${x}" y2="${beamY-4}" stroke="#00008b" stroke-width="1.3" marker-end="url(#ua)"/>`;
  }
  const diagramSVG=`
  <svg viewBox="0 0 ${SW} ${SH}" style="width:100%;max-width:480px;display:block;margin:6px auto;">
    <defs>
      <marker id="ua" markerWidth="5" markerHeight="5" refX="2.5" refY="5" orient="auto"><path d="M0,0 L2.5,5 L5,0" fill="none" stroke="#00008b" stroke-width="1.2"/></marker>
      <marker id="Wa" markerWidth="7" markerHeight="7" refX="3.5" refY="7" orient="auto"><path d="M0,0 L3.5,7 L7,0 Z" fill="#cc0000"/></marker>
      <marker id="Ra" markerWidth="6" markerHeight="6" refX="3" refY="0" orient="auto"><path d="M0,6 L3,0 L6,6 Z" fill="#166534"/></marker>
    </defs>
    <!-- UDL -->
    <line x1="${Ax}" y1="${beamY-32}" x2="${Bx}" y2="${beamY-32}" stroke="#00008b" stroke-width="1.2"/>
    ${sp}
    <text x="${(Ax+Bx)/2}" y="${beamY-38}" text-anchor="middle" font-family="Architects Daughter" font-size="10.5" fill="#00008b">Gk = ${Gk} kN/m,  Qk = ${Qk} kN/m</text>
    
    <!-- Beam -->
    <rect x="${Ax}" y="${beamY-3}" width="${Bx-Ax}" height="7" fill="#00008b" rx="1.5"/>
    
    <!-- Fixed Support A -->
    <line x1="${Ax}" y1="${beamY-20}" x2="${Ax}" y2="${beamY+30}" stroke="#333" stroke-width="3"/>
    ${[-15,-5,5,15,25].map(dy=>`<line x1="${Ax-10}" y1="${beamY+dy}" x2="${Ax}" y2="${beamY+6+dy}" stroke="#333" stroke-width="1.5"/>`).join('')}
    
    <!-- Roller Support B -->
    <polygon points="${Bx},${beamY+4} ${Bx-9},${beamY+24} ${Bx+9},${beamY+24}" fill="none" stroke="#333" stroke-width="1.8"/>
    <circle cx="${Bx-4.5}" cy="${beamY+29}" r="4" fill="none" stroke="#333" stroke-width="1.5"/>
    <circle cx="${Bx+4.5}" cy="${beamY+29}" r="4" fill="none" stroke="#333" stroke-width="1.5"/>
    <line x1="${Bx-16}" y1="${beamY+33}" x2="${Bx+16}" y2="${beamY+33}" stroke="#333" stroke-width="2"/>
    
    <!-- Point Load C -->
    <line x1="${Cx}" y1="${beamY-64}" x2="${Cx}" y2="${beamY-4}" stroke="#cc0000" stroke-width="2.2" marker-end="url(#Wa)"/>
    <text x="${Cx}" y="${beamY-68}" text-anchor="middle" font-family="Architects Daughter" font-size="11" fill="#cc0000">${Q} kN</text>
    
    <!-- Reactions -->
    <line x1="${Ax+10}" y1="${beamY+54}" x2="${Ax+10}" y2="${beamY+24}" stroke="#166534" stroke-width="2" marker-end="url(#Ra)"/>
    <text x="${Ax+10}" y="${beamY+68}" text-anchor="middle" font-family="Architects Daughter" font-size="10" fill="#166534">RA</text>
    <line x1="${Bx}" y1="${beamY+64}" x2="${Bx}" y2="${beamY+38}" stroke="#166534" stroke-width="2" marker-end="url(#Ra)"/>
    <text x="${Bx}" y="${beamY+78}" text-anchor="middle" font-family="Architects Daughter" font-size="10" fill="#166534">RB</text>
    
    <!-- Labels -->
    <text x="${Ax-6}" y="${beamY-8}" text-anchor="end" font-family="Architects Daughter" font-size="10" fill="#333">A</text>
    <text x="${Cx+6}" y="${beamY+15}" text-anchor="start" font-family="Architects Daughter" font-size="10" fill="#333">C</text>
    <text x="${Bx+12}" y="${beamY-8}" text-anchor="start" font-family="Architects Daughter" font-size="10" fill="#333">B</text>
    
    <!-- Dimensions -->
    <line x1="${Ax}" y1="${beamY+92}" x2="${Cx}" y2="${beamY+92}" stroke="#555" stroke-width="1"/>
    <line x1="${Ax}" y1="${beamY+87}" x2="${Ax}" y2="${beamY+97}" stroke="#555" stroke-width="1"/>
    <line x1="${Cx}" y1="${beamY+87}" x2="${Cx}" y2="${beamY+97}" stroke="#555" stroke-width="1"/>
    <text x="${(Ax+Cx)/2}" y="${beamY+105}" text-anchor="middle" font-family="Architects Daughter" font-size="10" fill="#333">${a} m</text>
    <line x1="${Cx}" y1="${beamY+92}" x2="${Bx}" y2="${beamY+92}" stroke="#555" stroke-width="1"/>
    <line x1="${Bx}" y1="${beamY+87}" x2="${Bx}" y2="${beamY+97}" stroke="#555" stroke-width="1"/>
    <text x="${(Cx+Bx)/2}" y="${beamY+105}" text-anchor="middle" font-family="Architects Daughter" font-size="10" fill="#333">${b} m</text>
  </svg>`;

  // ════════════════════════════════════════════════════════
  //  SVG: SHEAR FORCE DIAGRAM (SFD)
  // ════════════════════════════════════════════════════════
  const FW=400;
  const sfdBase = 80;
  const FCx=40+Math.round(320*(a/L));
  
  const sfMax = Math.max(Math.abs(SFA), Math.abs(SFCb), Math.abs(SFCa), Math.abs(SFBl));
  const sfScale = sfMax > 0 ? 55 / sfMax : 1;
  const ySFA = sfdBase - SFA * sfScale;
  const ySFCb = sfdBase - SFCb * sfScale;
  const ySFCa = sfdBase - SFCa * sfScale;
  const ySFBl = sfdBase - SFBl * sfScale;
  
  const sfdSVG=`
  <svg viewBox="0 0 ${FW} 160" style="width:100%;max-width:400px;display:block;margin:4px auto;">
    <line x1="40" y1="${sfdBase}" x2="360" y2="${sfdBase}" stroke="#333" stroke-width="1.5"/>
    <text x="368" y="${sfdBase+3}" font-family="Arial" font-size="9" fill="#333">0</text>
    <polygon points="40,${sfdBase} 40,${ySFA} ${FCx},${ySFCb} ${FCx},${ySFCa} 360,${ySFBl} 360,${sfdBase}" 
             fill="rgba(22, 101, 52, 0.15)" stroke="#166534" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="40" cy="${sfdBase}" r="2" fill="#333"/>
    <circle cx="${FCx}" cy="${sfdBase}" r="2" fill="#333"/>
    <circle cx="360" cy="${sfdBase}" r="2" fill="#333"/>
    <text x="40" y="${sfdBase+15}" text-anchor="middle" font-family="Architects Daughter" font-size="10" fill="#555">A</text>
    <text x="${FCx}" y="${sfdBase+15}" text-anchor="middle" font-family="Architects Daughter" font-size="10" fill="#555">C</text>
    <text x="360" y="${sfdBase+15}" text-anchor="middle" font-family="Architects Daughter" font-size="10" fill="#555">B</text>
    <text x="45" y="${ySFA-5}" font-family="Arial" font-size="9" fill="#166534" font-weight="bold">${f(SFA,1)}</text>
    <text x="${FCx-5}" y="${ySFCb-5}" text-anchor="end" font-family="Arial" font-size="9" fill="#166534">${f(SFCb,1)}</text>
    <text x="${FCx+5}" y="${ySFCa+10}" text-anchor="start" font-family="Arial" font-size="9" fill="#166534">${f(SFCa,1)}</text>
    <text x="355" y="${ySFBl+12}" text-anchor="end" font-family="Arial" font-size="9" fill="#166534" font-weight="bold">${f(SFBl,1)}</text>
  </svg>`;

  // ════════════════════════════════════════════════════════
  //  SVG: BENDING MOMENT DIAGRAM (BMD)
  // ════════════════════════════════════════════════════════
  let bmdPtsStr = `40,90 `;
  const bmScale = Mmax > 0 ? 60 / Mmax : 1;
  const bmdBase = 90;
  
  for(let i=0; i<=50; i++) {
     let x_from_A = (i/50)*L;
     let x_from_B = L - x_from_A;
     let mx = RB * x_from_B - wu * Math.pow(x_from_B, 2) / 2;
     if (x_from_B > b) mx -= Wu * (x_from_B - b);
     let px = 40 + (i/50)*320;
     let py = bmdBase - mx * bmScale; 
     bmdPtsStr += `${px},${py} `;
  }
  bmdPtsStr += `360,90`;

  const bmdSVG=`
  <svg viewBox="0 0 ${FW} 180" style="width:100%;max-width:400px;display:block;margin:4px auto;">
    <line x1="40" y1="${bmdBase}" x2="360" y2="${bmdBase}" stroke="#333" stroke-width="1.5"/>
    <text x="368" y="${bmdBase+3}" font-family="Arial" font-size="9" fill="#333">0</text>
    <polygon points="${bmdPtsStr}" fill="rgba(0, 0, 139, 0.1)" stroke="#00008b" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="40" y1="${bmdBase}" x2="40" y2="${bmdBase - MA * bmScale}" stroke="#777" stroke-dasharray="2,2"/>
    <line x1="${FCx}" y1="${bmdBase}" x2="${FCx}" y2="${bmdBase - BMC * bmScale}" stroke="#777" stroke-dasharray="2,2"/>
    <circle cx="40" cy="${bmdBase}" r="2" fill="#333"/>
    <circle cx="${FCx}" cy="${bmdBase}" r="2" fill="#333"/>
    <circle cx="360" cy="${bmdBase}" r="2" fill="#333"/>
    <text x="40" y="${bmdBase+15}" text-anchor="middle" font-family="Architects Daughter" font-size="10" fill="#555">A</text>
    <text x="${FCx}" y="${bmdBase+15}" text-anchor="middle" font-family="Architects Daughter" font-size="10" fill="#555">C</text>
    <text x="360" y="${bmdBase+15}" text-anchor="middle" font-family="Architects Daughter" font-size="10" fill="#555">B</text>
    <text x="45" y="${bmdBase - MA * bmScale + 12}" font-family="Arial" font-size="9" fill="#00008b" font-weight="bold">${f(MA,1)}</text>
    <text x="${FCx}" y="${bmdBase - BMC * bmScale - 6}" text-anchor="middle" font-family="Arial" font-size="9" fill="#00008b" font-weight="bold">${f(BMC,1)}</text>
  </svg>`;

  // ════════════════════════════════════════════════════════
  //  BUILD PAGES - Matching PDF Texts Word-for-Word
  // ════════════════════════════════════════════════════════
  function page(rows, pgNum) {
    return `
    <div class="page">
      <div class="tbl-head">
        <div>Reference</div>
        <div>Calculation</div>
        <div>Output</div>
      </div>
      <div class="sheet-body">
        ${rows}
      </div>
      <div class="pgnum">Page No <u>${pgNum}</u></div>
    </div>`;
  }

  const p1 = page(`
    ${R('', '<span class="uline">Parameters given.</span>', '')}
    ${R('', `L = ${L} m&nbsp;&nbsp;&nbsp; Q = ${Q} kN`, '')}
    ${R('', `Gk = ${Gk} kN/m&nbsp;&nbsp;&nbsp; Qk = ${Qk} kN/m`, '')}
    ${BLANK()}
    ${SVGR('', diagramSVG, '')}
    ${BLANK()}
    ${R('', '<span class="uline">Total load on the beam.</span>', '')}
    ${R('', `(1.4(${Gk}) + 1.6(${Qk})) × ${L} + 1.6(${Q})`, '')}
    ${R('', `= ${f(wu,1)} × ${L} + ${f(Wu,1)}`, '')}
    ${R('', `<b>Total Design loading = ${f(tot,2)} kN</b>`, `${f(tot,0)} kN`)}
    ${BLANK()}
    ${R('', 'The beam section is statically indeterminate.', '')}
    ${R('', 'Thus reactions become', '')}
    ${R('', '<b>A₁x̄₁ = A₂x̄₂ + A₃x̄₃</b>', '')}
  `, 1);

  const p2 = page(`
    ${R('', `A₁x̄₁ = [½ × R<sub>B</sub> × ${L} × ${L}] × [⅔ × ${L}]`, '')}
    ${R('', `= ${f(A1_coeff, 2)} R<sub>B</sub>`, '')}
    ${BLANK()}
    ${R('', `A₂x̄₂ = [⅓ × ${L} × (${f(wu,1)}×${L}² / 2)] × [¾ × ${L}]`, '')}
    ${R('', `= <b>${f(A2X2, 1)}</b>`, '')}
    ${BLANK()}
    ${R('', `A₃x̄₃ = [½ × ${a} × (${f(Wu,1)}×${a})] × [${L} - ⅓ × ${a}]`, '')}
    ${R('', `= <b>${f(A3X3, 1)}</b>`, '')}
    ${BLANK()}
    ${R('', `A₁x̄₁ = A₂x̄₂ + A₃x̄₃`, '')}
    ${R('', `${f(A1_coeff, 2)} R<sub>B</sub> = ${f(A2X2, 1)} + ${f(A3X3, 1)}`, '')}
    ${R('', `R<sub>B</sub> = ${f(A2X2 + A3X3, 1)} / ${f(A1_coeff, 2)}`, '')}
    ${R('', `<span class="rbox"><b>R<sub>B</sub> = ${f(RB,2)} kN</b></span>`, `R<sub>B</sub> = ${f(RB,2)} kN`)}
    ${BLANK()}
    ${R('', `R<sub>A</sub> = (${f(wu,1)} × ${L}) + (${f(Wu,1)}) - ${f(RB,2)}`, '')}
    ${R('', `<span class="rbox"><b>R<sub>A</sub> = ${f(RA,2)} kN</b></span>`, `R<sub>A</sub> = ${f(RA,2)} kN`)}
    ${BLANK()}
    ${R('', '<span class="uline">SF (Shear force)</span>', '')}
    ${R('', `SF @ A = R<sub>A</sub> = ${f(SFA,2)} kN`, `${f(SFA,2)} kN`)}
    ${R('', `SF @ C (before) = ${f(SFA,2)} − (${f(wu)}×${a}) = ${f(SFCb,2)} kN`, '')}
  `, 2);

  const p3 = page(`
    ${R('', `SF @ C (after) = ${f(SFCb,2)} − ${f(Wu,1)} = ${f(SFCa,2)} kN`, '')}
    ${R('', `SF @ B = ${f(SFCa,2)} − (${f(wu)}×${b}) = ${f(SFBl,2)} kN ≈ -R<sub>B</sub>`, '')}
    ${BLANK()}
    ${R('', '<span class="uline">Shear Force Diagram</span>', '')}
    ${SVGR('', sfdSVG, '')}
    ${BLANK()}
    ${R('', '<span class="uline">Bending Moment</span>', '')}
    ${R('', `M<sub>A</sub> = ${f(RB,2)}(${L}) - ${f(wu,1)}(${L}² / 2) - ${f(Wu,1)}(${a})`, '')}
    ${R('', `M<sub>A</sub> = ${f(RB*L,2)} - ${f(wu*L*L/2 + Wu*a, 2)}`, '')}
    ${R('', `<span class="rbox"><b>M<sub>A</sub> = ${f(MA,2)} kNm</b></span>`, `M<sub>A</sub> = ${f(MA,2)} kNm`)}
    ${BLANK()}
    ${R('', `M<sub>C</sub> = ${f(RB,2)}(${b}) - ${f(wu,1)}(${b}² / 2)`, '')}
    ${R('', `M<sub>C</sub> = ${f(RB*b,2)} - ${f(wu*b*b/2, 2)} = <b>${f(BMC,2)} kNm</b>`, `M<sub>C</sub> = ${f(BMC,2)} kNm`)}
    ${BLANK()}
    ${R('', `M<sub>B</sub> = 0 kNm`, '')}
  `, 3);

  const p4 = page(`
    ${R('', '<span class="uline">Bending Moment Diagram</span>', '')}
    ${SVGR('', bmdSVG, '')}
    ${BLANK()}
    ${R('', '<span class="uline">Initial Section Selection</span>', '')}
    ${R('', `f<sub>y</sub> = ${py} N/mm² &nbsp;&nbsp;&nbsp; Take p<sub>y</sub> = ${py} N/mm²`, '')}
    ${R('', `Design Moment M<sub>max</sub> = ${f(Mmax, 2)} kNm`, '')}
    ${R('', `S<sub>x</sub> = M<sub>max</sub> × 10⁶ / p<sub>y</sub>`, '')}
    ${R('', `S<sub>x</sub> = ${f(Mmax,2)} × 10⁶ / ${py}`, '')}
    ${R('', `S<sub>x</sub> = ${f(Sx_req, 2)} mm³`, '')}
    ${R('', `<b>S<sub>x</sub> required = ${f(Sx_req_cm3, 2)} cm³</b>`, `S<sub>x</sub> = ${f0(Sx_req_cm3)} cm³`)}
    ${BLANK()}
    ${R('BS 5950<br>Table B1', '<span class="uline">Suitable Section from table</span>', '')}
    ${R('', `Selected: <b>${sec.n} UB</b>`, `${sec.n}`)}
    ${R('', `D = ${sec.D} mm &nbsp;&nbsp; B = ${sec.B} mm &nbsp;&nbsp; t = ${sec.t} mm`, '')}
    ${R('', `T = ${sec.T} mm &nbsp;&nbsp; r = ${sec.r} mm &nbsp;&nbsp; d = ${sec.d} mm`, '')}
    ${R('', `S<sub>x</sub> = ${sec.Sx} cm³ &nbsp;&nbsp; Z<sub>x</sub> = ${sec.Zx} cm³`, `S<sub>x</sub> = ${sec.Sx} cm³`)}
    ${BLANK()}
    ${R('', `Taking Section (${sec.n} UB) S<sub>x</sub> = ${sec.Sx} cm³ due to the following<br>strength (i) Lightness (ii) economic consideration.`, '')}
  `, 4);

  const p5 = page(`
    ${R('BS 5950<br>Table 11<br>Cl. 3.5.2', '<span class="uline">Strength Classification.</span>', '')}
    ${R('', `Since T (${sec.T}mm) ≤ 16mm, thus p<sub>y</sub> = ${py} N/mm²`, `p<sub>y</sub> = ${py}`)}
    ${R('', `&epsilon; = &radic;(275/p<sub>y</sub>) = &radic;(275/${py}) = <b>${f(eps,3)}</b>`, `&epsilon; = ${f(eps,3)}`)}
    ${BLANK()}
    ${R('', '<span class="uline">Section Classification.</span>', '')}
    ${R('', `b/T = ${f(sec.B/2, 2)} / ${sec.T} = <b>${f(b_T,2)}</b>`, `b/T = ${f(b_T,2)}`)}
    ${R('', `Since b/T (${f(b_T,2)}) &le; 9&epsilon; (${f(9*eps,2)})`, '')}
    ${R('', `The flange is <b>${flCls}</b>`, `${flCls}`)}
    ${BLANK()}
    ${R('', `d/t = ${sec.d}/${sec.t} = <b>${f(d_t,2)}</b>`, `d/t = ${f(d_t,2)}`)}
    ${R('', `Since d/t (${f(d_t,2)}) &le; 80&epsilon; (${f(80*eps,2)})`, '')}
    ${R('', `It has a <b>${wbCls}</b> web`, `${wbCls}`)}
    ${BLANK()}
    ${R('BS 5950<br>Cl. 4.4.5', '<span class="uline">Shear buckling</span>', '')}
    ${R('', `Since d/t (${f(d_t,2)}) ${d_t<=70*eps?'&lt;':'&gt;'} 70&epsilon; (${f(70*eps,2)})`, '')}
    ${d_t<=70*eps
      ? R('', `No shear buckling is required.`, `${OK(true)}`)
      : R('', `Shear buckling critical`, `${OK(false)}`)}
    ${BLANK()}
    ${R('Cl. 4.2.3', '<span class="uline">Shear Capacity</span>', '')}
    ${R('', `P<sub>v</sub> = 0.6 · p<sub>y</sub> · A<sub>v</sub>&nbsp;&nbsp; (where A<sub>v</sub> = t · D)`, '')}
    ${R('', `P<sub>v</sub> = 0.6 × ${py} × ${sec.t} × ${sec.D} / 1000`, '')}
    ${R('', `P<sub>v</sub> = <b>${f(Pv,1)} kN</b>`, `P<sub>v</sub> = ${f(Pv,1)} kN`)}
    ${R('', `Since F<sub>v</sub> (${f(RA,2)}) ${sh_ok?'&lt;':'&gt;'} P<sub>v</sub> (${f(Pv,1)}) thus okay.`, `${OK(sh_ok)}`)}
    ${R('', `This implies the section has ${lowSh?'<b>low</b>':'<b>high</b>'} shear.`, '')}
  `, 5);

  const p6 = page(`
    ${R('Cl. 4.2.5', '<span class="uline">Bending Moment Capacity</span>', '')}
    ${R('', `Moment Capacity M<sub>c</sub> = p<sub>y</sub> S<sub>x</sub> &le; 1.2 p<sub>y</sub> Z<sub>x</sub>`, '')}
    ${R('', `M<sub>c</sub> = ${py} × ${sec.Sx} × 10³ / 10⁶ = <b>${f(Mc_f,2)} kNm</b>`, '')}
    ${R('', `1.2 p<sub>y</sub> Z<sub>x</sub> = 1.2 × ${py} × ${sec.Zx} × 10³ / 10⁶ = <b>${f(Mc_l,2)} kNm</b>`, '')}
    ${R('', `Since M<sub>c</sub> (${f(Mc,2)}) &le; 1.2 p<sub>y</sub> Z<sub>x</sub> (${f(Mc_l,2)})`, '')}
    ${R('', `The bending moment capacity is <b>${f(Mc,2)} kNm</b>.`, `M<sub>c</sub> = ${f(Mc,2)} kNm`)}
    ${BLANK()}
    ${R('', '<span class="uline">Moment due to self weight & Imposed loading</span>', '')}
    ${R('', `G<sub>sw</sub> = ${sec.m} × 9.81 / 1000 = ${f(Gsw,3)} kN/m`, '')}
    ${R('', `Span Moment (Propped Cantilever) M<sub>sw</sub> = 1.4(${f(Gsw,3)}) × ${L}² × 9 / 128`, '')}
    ${R('', `M<sub>sw</sub> = ${f(Msw, 2)} kNm`, '')}
    ${R('', `M<sub>t</sub> = Max Moment + M<sub>sw</sub>`, '')}
    ${R('', `M<sub>t</sub> = ${f(Mmax,2)} + ${f(Msw,2)} = <b>${f(Mmax2,2)} kNm</b>`, `M<sub>t</sub> = ${f(Mmax2,2)} kNm`)}
    ${R('', `Since M<sub>t</sub> (${f(Mmax2,2)} kNm) ${mc_ok?'&lt;':'&gt;'} M<sub>c</sub> (${f(Mc,2)} kNm)`, '')}
    ${R('', `Thus the section is ${mc_ok?'<b>okay</b>':'<b class="fail">inadequate</b>'}.`, `${OK(mc_ok)}`)}
  `, 6);

  const p7 = page(`
    ${R('BS 5950<br>Cl. 2.5.2', '<span class="uline">Deflection Check</span>', '')}
    ${R('', 'Limit on Beams due to vertical and point load on propped cantilever', '')}
    ${R('', `&delta;<sub>c</sub> = wL⁴ / 185 EI + W a² b² / 3 E I L`, '')}
    ${R('', `&delta;<sub>c</sub> (UDL) = ${Qk} × ${Lmm}⁴ / (185 × 205000 × ${sec.Ix}0000)`, '')}
    ${R('', `= ${f(dS_udl,2)} mm`, '')}
    ${R('', `&delta;<sub>c</sub> (Pt) = ${Q*1000} × ${amm}² × ${bmm}² / (3 × 205000 × ${sec.Ix}0000 × ${Lmm})`, '')}
    ${R('', `= ${f(dS_pt,2)} mm`, '')}
    ${R('', `&delta;<sub>c</sub> = ${f(dS_udl,2)} + ${f(dS_pt,2)} = <b>${f(dC,2)} mm</b>`, `&delta;<sub>c</sub> = ${f(dC,1)} mm`)}
    ${BLANK()}
    ${R('', '<b>Limit:</b>', '')}
    ${R('', `Limit = L / 180 = ${Lmm} / 180 = <b>${f(dCL,2)} mm</b>`, `L/180 = ${f(dCL,1)} mm`)}
    ${BLANK()}
    ${R('', `Since max deflection ${f(dC,2)} mm &lt; ${f(dCL,2)} mm`, '')}
    ${dC_ok
      ? R('', 'No deflection at the beam. <b>Deflection is OK</b>', `${OK(dC_ok)}`)
      : R('', '<b class="fail">Deflection EXCEEDS limit</b>', `${OK(dC_ok)}`)}
    ${BLANK()}
    ${R('Cl. 4.5.2', '<span class="uline">Web bearing at the support</span>', '')}
    ${R('', `P<sub>bw</sub> = (b₁ + n·k) · t · p<sub>y</sub>`, '')}
    ${R('', `b₁ = ${b1} mm &nbsp;&nbsp;&nbsp; b<sub>e</sub> = 0`, '')}
    ${R('', `T = ${sec.T} mm &nbsp;&nbsp;&nbsp; r = ${sec.r} mm`, '')}
    ${R('', `k = T + r = ${sec.T} + ${sec.r} = <b>${f(k,1)} mm</b>`, `k = ${f(k,1)} mm`)}
    ${R('', `n = ${n}`, '')}
  `, 7);

  const p8 = page(`
    ${R('', `P<sub>bw</sub> = (${b1} + ${n} × ${f(k,1)}) × ${sec.t} × ${py} / 1000`, '')}
    ${R('', `<span class="rbox"><b>P<sub>bw</sub> = ${f(Pbw,2)} kN</b></span>`, `P<sub>bw</sub> = ${f(Pbw,2)} kN`)}
    ${BLANK()}
    ${R('', `Since it is greater than Shear force at the support`, '')}
    ${R('', `i.e. P<sub>bw</sub> (${f(Pbw,2)} kN) &gt; R<sub>A</sub> (${f(RA,2)} kN)`, '')}
    ${R('', `Thus web bearing is <b>okay</b>`, `${OK(br_ok)}`)}
    ${BLANK()}
    ${R('', `<b>Contact stress at support</b>`, '')}
    ${R('', `P<sub>cs</sub> = (b₁ × k) p<sub>y</sub>`, '')}
    ${R('', `= (${b1} × ${f(k,1)}) × ${py} / 1000`, '')}
    ${R('', `P<sub>cs</sub> = <b>${f(Pcs,2)} kN</b>`, `P<sub>cs</sub> = ${f(Pcs,2)} kN`)}
    ${R('', `Since P<sub>cs</sub> (${f(Pcs,2)} kN) &gt; R<sub>A</sub> (${f(RA,2)} kN) thus it is okay.`, '')}
    ${BLANK()}
    ${R('BS 5950<br>Cl. 4.5.3.1', '<span class="uline">Web Buckling at the Support</span>', '')}
    ${R('', `From table d = ${sec.d} mm`, '')}
    ${R('', `P<sub>x</sub> = [25&epsilon;·t / &radic;((b₁+n·k)·d)] × P<sub>bw</sub>`, '')}
    ${R('', `= [25 × ${f(epsS,3)} × ${sec.t} / &radic;((${b1} + ${f(n*k,1)}) × ${sec.d})] × ${f(Pbw,2)}`, '')}
    ${R('', `= [${f(25*epsS*sec.t,2)} / &radic;(${f((b1+n*k)*sec.d,1)})] × ${f(Pbw,2)}`, '')}
    ${R('', `= [${f(25*epsS*sec.t,2)} / ${f(Math.sqrt((b1+n*k)*sec.d),2)}] × ${f(Pbw,2)}`, '')}
    ${R('', `<span class="rbox"><b>P<sub>x</sub> = ${f(Px,2)} kN</b></span>`, `P<sub>x</sub> = ${f(Px,2)} kN`)}
    ${BLANK()}
    ${R('', `Since P<sub>x</sub> (${f(Px,2)} kN) &gt; R<sub>A</sub> (${f(RA,2)} kN)`, '')}
    ${R('', `Thus buckling at the support is <b>okay</b>.`, `${OK(bk_ok)}`)}
    ${R('', `So no web stiffeners are required at the support.`, '')}
  `, 8);

  const checks = [
    ['Shear capacity: R<sub>A</sub> &le; P<sub>v</sub>', sh_ok, `${f(RA,1)} kN &le; ${f(Pv,1)} kN`],
    ['Moment capacity: M<sub>t</sub> &le; M<sub>c</sub>', mc_ok, `${f(Mmax2,1)} kNm &le; ${f(Mc,1)} kNm`],
    ['Deflection: &delta;<sub>c</sub> &le; L/180', dC_ok, `${f(dC,1)} mm &le; ${f(dCL,1)} mm`],
    ['Web bearing: R<sub>A</sub> &le; P<sub>bw</sub>', br_ok, `${f(RA,1)} kN &le; ${f(Pbw,1)} kN`],
    ['Web buckling: R<sub>A</sub> &le; P<sub>x</sub>', bk_ok, `${f(RA,1)} kN &le; ${f(Px,1)} kN`],
  ];

  const p9 = page(`
    ${R('', '<span class="uline">Design Summary — All Checks</span>', '')}
    ${BLANK()}
    ${R('', '<b>Input Parameters:</b>', '')}
    ${R('', `a = ${a} m &nbsp; b = ${b} m &nbsp; L = ${L} m`, '')}
    ${R('', `G<sub>k</sub> = ${Gk} kN/m &nbsp; Q<sub>k</sub> = ${Qk} kN/m &nbsp; Q = ${Q} kN`, '')}
    ${R('', `p<sub>y</sub> = ${py} N/mm² &nbsp; b₁ = ${b1} mm`, '')}
    ${BLANK()}
    ${R('', '<b>Factored Loads:</b>', '')}
    ${R('', `w<sub>u</sub> = 1.4×${Gk} + 1.6×${Qk} = ${f(wu,2)} kN/m`, `${f(wu,2)} kN/m`)}
    ${R('', `W<sub>u</sub> = 1.6×${Q} = ${f(Wu,1)} kN`, `${f(Wu,1)} kN`)}
    ${R('', `Total factored load = ${f(tot,2)} kN`, `${f(tot,1)} kN`)}
    ${BLANK()}
    ${R('', '<b>Reactions:</b>', '')}
    ${R('', `R<sub>A</sub> = ${f(RA,2)} kN`, `${f(RA,2)} kN`)}
    ${R('', `R<sub>B</sub> = ${f(RB,2)} kN`, `${f(RB,2)} kN`)}
    ${BLANK()}
    ${R('', `<b>Selected Section: ${sec.n} UB (${sec.m} kg/m)</b>`, sec.n)}
    ${R('', `Classification: ${flCls} Flange, ${wbCls} Web`, '')}
    ${BLANK()}
    ${R('', '<span class="uline">Summary of Design Checks:</span>', '')}
    ${checks.map(([lbl,pass,val])=>
      R('', `${lbl}: &nbsp; ${val}`, OK(pass))
    ).join('')}
    ${BLANK()}
    ${BLANK()}
    ${R('', `
      <div style="border:3px double ${allOk?'#166534':'#991b1b'};
                  padding:10px 16px; text-align:center;
                  color:${allOk?'#166534':'#991b1b'}; font-size:14px; font-weight:bold;">
        ${allOk
          ? `&#10003; Section <u>${sec.n} UB</u> is FULLY SATISFACTORY<br>for the given loading conditions.`
          : `&#10007; Section ${sec.n} UB is INADEQUATE<br>&mdash; increase section size.`}
      </div>`, '')}
  `, 9);

  document.getElementById('out').innerHTML = p1+p2+p3+p4+p5+p6+p7+p8+p9;
}

// ── Wire all inputs to update() ──────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('#bar input, #bar select').forEach(el => {
    el.addEventListener('input', update);
    el.addEventListener('change', update);
  });
  // Grade dropdown syncs py field
  document.getElementById('iGrade').addEventListener('change', function(){
    document.getElementById('iPy').value = this.value;
  });
  update();
});
</script>
</body>
</html>
