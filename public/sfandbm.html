<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beam Calculation Sheet</title>
<style>
body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
h1 { color: #0b3d91; }
label { display:block; margin-top:10px; }
input { width: 100px; padding:4px; margin-left:5px; }
button { margin-top: 15px; padding: 8px 12px; }
.step { background: #fff; padding: 10px; margin-top: 10px; border-left: 4px solid #0b3d91; }
.step pre { margin:0; white-space: pre-wrap; }
</style>
</head>
<body>

<h1>Beam Calculation Sheet (Section Method)</h1>

<div>
  <label>Left Overhang (L1, m): <input id="L_left" type="number" step="0.1" value="2.0"></label>
  <label>Main Span (L2, m): <input id="L_span" type="number" step="0.1" value="8.0"></label>
  <label>Right Overhang (L3, m): <input id="L_right" type="number" step="0.1" value="3.0"></label>
  <label>UDL w (kN/m): <input id="udl" type="number" step="0.1" value="9.0"></label>
  <label>Point Load P (kN): <input id="P_load" type="number" step="1" value="35.0"></label>
  <label>Position from left end (m): <input id="P_pos" type="number" step="0.1" value="6.0"></label>
  <button onclick="runCalculations()">Run Calculation</button>
</div>

<div id="output"></div>

<script>
// ---------- Helper ----------
function f(num, d=2){ return num.toFixed(d); }

// ---------- Calculation Engine ----------
function runCalculations() {
    const L1 = parseFloat(document.getElementById('L_left').value);
    const L2 = parseFloat(document.getElementById('L_span').value);
    const L3 = parseFloat(document.getElementById('L_right').value);
    const w = parseFloat(document.getElementById('udl').value);
    const P = parseFloat(document.getElementById('P_load').value);
    const xP = parseFloat(document.getElementById('P_pos').value);

    const L_total = L1 + L2 + L3;
    const xA = L1;
    const xB = L1 + L2;

    // Step 1: Total UDL
    const totalUDL = w * L_total;
    const step1 = `Total UDL = w × L_total = ${w} × ${f(L_total)} = ${f(totalUDL)} kN`;

    // Step 2: Reactions
    const M_UDL = w*L_total*(L_total/2 - L1);
    const M_P = P*(xP - L1);
    const R_B = (M_UDL + M_P)/L2;
    const R_A = totalUDL + P - R_B;
    const step2 = `Moment about A: R_B × L2 = M_UDL + M_P → R_B = ${f(R_B)} kN\nVertical equilibrium: R_A = totalUDL + P - R_B = ${f(R_A)} kN`;

    // Step 3: Shear Force at Key Points
    const critX = [0, xA, xP, xB, L_total].sort((a,b)=>a-b);
    const shearPoints = critX.map(x=>{
        let V = R_A - w*x;
        if(x >= xP) V -= P;
        if(x >= xB) V -= R_B;
        return {x, V};
    });
    let step3 = "Shear Force at critical points:\n";
    shearPoints.forEach(p => step3 += `x=${f(p.x)} m → V=${f(p.V)} kN\n`);

    // Step 4: Bending Moment at Key Points
    const momentPoints = critX.map(x=>{
        let M = R_A*x - w*x*x/2;
        if(x >= xP) M -= P*(x - xP);
        if(x >= xB) M -= R_B*(x - xB);
        return {x, M};
    });
    let step4 = "Bending Moment at critical points:\n";
    momentPoints.forEach(p => step4 += `x=${f(p.x)} m → M=${f(p.M)} kNm\n`);

    // Step 5: Max/Min
    const maxShear = Math.max(...shearPoints.map(p=>p.V));
    const minShear = Math.min(...shearPoints.map(p=>p.V));
    const maxMoment = Math.max(...momentPoints.map(p=>p.M));
    const minMoment = Math.min(...momentPoints.map(p=>p.M));
    const step5 = `Max Shear = ${f(maxShear)} kN, Min Shear = ${f(minShear)} kN\nMax Moment = ${f(maxMoment)} kNm, Min Moment = ${f(minMoment)} kNm`;

    // ---------- Display Steps ----------
    const outputDiv = document.getElementById('output');
    outputDiv.innerHTML = "";
    [step1, step2, step3, step4, step5].forEach((s,i)=>{
        const div = document.createElement('div');
        div.className = 'step';
        div.innerHTML = `<h3>Step ${i+1}</h3><pre>${s}</pre>`;
        outputDiv.appendChild(div);
    });
}
</script>
</body>
</html>
